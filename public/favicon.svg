<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd84d" />
      <stop offset="100%" stop-color="#f0c030" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon Outer Border -->
  <path d="M 256,34 L 448,145 L 448,367 L 256,478 L 64,367 L 64,145 Z" fill="none" stroke="url(#yellowGrad)" stroke-width="20" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Outer circuit details (Nodes) -->
  <circle cx="256" cy="34" r="10" fill="#ffd84d"/>
  <circle cx="448" cy="145" r="10" fill="#ffd84d"/>
  <circle cx="448" cy="367" r="10" fill="#ffd84d"/>
  <circle cx="256" cy="478" r="10" fill="#ffd84d"/>
  <circle cx="64" cy="367" r="10" fill="#ffd84d"/>
  <circle cx="64" cy="145" r="10" fill="#ffd84d"/>

  <!-- Tre-Con emblem: Sleek T merging into a tremor wave / ECG -->
  <path d="M 160,160 L 352,160 M 256,160 L 256,280 L 210,315 L 256,350 L 302,315 L 256,280" fill="none" stroke="url(#yellowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sleek ECG / Tremor wave line underneath -->
  <path d="M 110,390 L 175,390 L 195,350 L 220,430 L 245,290 L 270,420 L 290,370 L 305,390 L 402,390" fill="none" stroke="#f5f5f5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>